spring:
  jpa:
    defer-datasource-initialization: true
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: none
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://localhost:5432/budget_counter
    username: postgres
    password: adminadmin
  flyway:
    enabled: true
    locations: classpath:db/migration
